name: govulncheck

on:
  push:
    branches:
      - master
  # Also on pull requests: an advisory is cheaper to deal with before it
  # lands than after, and it makes a change to this workflow verifiable
  # without merging it first.
  pull_request:
  schedule:
    # Weekly, off-peak UTC time (Monday 04:17 UTC).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # govulncheck is a tool, not part of the build: it is compiled here and
        # then analyses the module's own go.mod. It must therefore run on a Go
        # new enough to build itself, which is not the project's minimum --
        # golang.org/x/vuln v1.8.0 already requires go 1.26, and setup-go pins
        # GOTOOLCHAIN=local so Go will not fetch a newer one on its own.
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
